<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="960" viewBox="0 0 1500 960" role="img" aria-labelledby="title description">
  <title id="title">Single-channel CAN-FD development-board bring-up wiring</title>
  <desc id="description">Development-board bring-up wiring reference for one MCP2518FD Pro and one OLED. It is not the product topology or final pinout. Integrating the other four CAN channels and W5500 may change SPI grouping, GPIOs, power, protection, and connectors even though CAN-FD 1 remains a dedicated channel.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #172033; }
    .title { font-size: 28px; font-weight: 700; }
    .subtitle { font-size: 15px; fill: #526078; }
    .head { font-size: 20px; font-weight: 700; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 13px; fill: #526078; }
    .card { fill: #f7f9fc; stroke: #b8c5d6; stroke-width: 2; }
    .header { fill: #e9eef6; }
    .wire { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .dot { stroke: #fff; stroke-width: 2; }
  </style>

  <rect width="1500" height="960" fill="#ffffff"/>
  <text x="42" y="46" class="title">CAN-FD 1 Development-Board Bring-up: ESP32-S3 + MCP2518FD Pro + OLED</text>
  <text x="42" y="74" class="subtitle">Development connection record only; follow printed pin labels. Diagram is not to physical scale.</text>
  <rect x="42" y="88" width="1408" height="24" rx="6" fill="#fff1ee" stroke="#d64c4c" stroke-width="1"/>
  <text x="54" y="105" class="small">CAN-FD 1 GPIOs are retained in the product plan: SPI2 SCK/MOSI/MISO 12/11/13, CS10, INT9. Full expansion wiring is in the companion product diagram.</text>

  <rect x="42" y="120" width="350" height="620" rx="18" class="card"/>
  <rect x="42" y="120" width="350" height="62" rx="18" class="header"/>
  <path d="M42 164 H392" stroke="#b8c5d6" stroke-width="2"/>
  <text x="68" y="158" class="head">ESP32-S3</text>
  <text x="72" y="224" class="label">GPIO 13  MISO</text>
  <text x="72" y="264" class="label">GPIO 12  SCK</text>
  <text x="72" y="304" class="label">GPIO 11  MOSI</text>
  <text x="72" y="344" class="label">GPIO 10  CS</text>
  <text x="72" y="384" class="label">GPIO 9   INT</text>
  <text x="72" y="444" class="label">3V3 (2 pins, same rail)</text>
  <text x="72" y="484" class="label">5V</text>
  <text x="72" y="524" class="label">GND (common)</text>
  <text x="72" y="584" class="label">GPIO 8   I2C SCL</text>
  <text x="72" y="624" class="label">GPIO 7   I2C SDA</text>
  <text x="72" y="684" class="small">MCP: GPIO 9–13</text>
  <text x="72" y="706" class="small">OLED: GPIO 7/8</text>

  <rect x="580" y="120" width="385" height="510" rx="18" class="card"/>
  <rect x="580" y="120" width="385" height="62" rx="18" class="header"/>
  <path d="M580 164 H965" stroke="#b8c5d6" stroke-width="2"/>
  <text x="607" y="158" class="head">MCP2518FD Pro</text>
  <text x="630" y="224" class="label">SDO (MISO)</text>
  <text x="630" y="264" class="label">SCK</text>
  <text x="630" y="304" class="label">SDI (MOSI)</text>
  <text x="630" y="344" class="label">CS</text>
  <text x="630" y="384" class="label">INT</text>
  <text x="630" y="444" class="label">3V3  [P3 = 3V3]</text>
  <text x="630" y="484" class="label">5V</text>
  <text x="630" y="524" class="label">GND</text>
  <text x="607" y="568" class="small">STBY / NS：按模块跳线设正常模式</text>
  <text x="607" y="594" class="small">CLKO / INT0 / INT1 / NC：基础接线不接</text>

  <rect x="1080" y="400" width="370" height="330" rx="18" class="card"/>
  <rect x="1080" y="400" width="370" height="62" rx="18" class="header"/>
  <path d="M1080 444 H1450" stroke="#b8c5d6" stroke-width="2"/>
  <text x="1107" y="438" class="head">0.96&quot; I2C OLED</text>
  <text x="1120" y="514" class="label">SCL</text>
  <text x="1120" y="574" class="label">SDA</text>
  <text x="1120" y="634" class="label">VCC</text>
  <text x="1120" y="694" class="label">GND</text>

  <path d="M392 220 H580" class="wire" stroke="#377bd1"/>
  <path d="M392 260 H580" class="wire" stroke="#8147b8"/>
  <path d="M392 300 H580" class="wire" stroke="#e2832f"/>
  <path d="M392 340 H580" class="wire" stroke="#d64c4c"/>
  <path d="M392 380 H580" class="wire" stroke="#c49a18"/>
  <path d="M392 440 H580" class="wire" stroke="#e64b3c"/>
  <path d="M392 480 H580" class="wire" stroke="#ad5d35"/>
  <path d="M392 520 H580" class="wire" stroke="#26354a"/>
  <circle cx="392" cy="220" r="6" class="dot" fill="#377bd1"/>
  <circle cx="392" cy="260" r="6" class="dot" fill="#8147b8"/>
  <circle cx="392" cy="300" r="6" class="dot" fill="#e2832f"/>
  <circle cx="392" cy="340" r="6" class="dot" fill="#d64c4c"/>
  <circle cx="392" cy="380" r="6" class="dot" fill="#c49a18"/>
  <circle cx="392" cy="440" r="6" class="dot" fill="#e64b3c"/>
  <circle cx="392" cy="480" r="6" class="dot" fill="#ad5d35"/>
  <circle cx="392" cy="520" r="6" class="dot" fill="#26354a"/>

  <path d="M392 584 H430 V750 H1060 V514 H1080" class="wire" stroke="#3578d4"/>
  <path d="M392 624 H460 V770 H1040 V574 H1080" class="wire" stroke="#23966a"/>
  <path d="M965 440 H1000 V634 H1080" class="wire" stroke="#e64b3c"/>
  <path d="M392 520 H450 V810 H1020 V694 H1080" class="wire" stroke="#26354a"/>
  <circle cx="392" cy="584" r="6" class="dot" fill="#3578d4"/>
  <circle cx="392" cy="624" r="6" class="dot" fill="#23966a"/>

  <rect x="42" y="835" width="890" height="68" rx="12" fill="#fff8e6" stroke="#e6c66a" stroke-width="1.5"/>
  <text x="64" y="862" class="label">Power notes</text>
  <text x="64" y="887" class="small">Both ESP 3V3 pins share one rail; any ESP pin marked GND is common. MCP 5V uses ESP 5V. Disconnect USB before wiring.</text>

  <text x="42" y="930" class="small">MCP DB9/CANH/CANL mapping is not shown as a numbered DB9 pinout; verify CH/CL continuity with power disconnected.</text>
</svg>
